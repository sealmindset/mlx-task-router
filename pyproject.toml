[project]
name = "mlx-task-router"
version = "0.1.0"
description = "Smart proxy that routes mundane CLI tasks to local MLX models, forwarding complex tasks to the Anthropic API"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "mlx-lm>=0.26.2",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
mlx-router = "mlx_task_router.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlx_task_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
